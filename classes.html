<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Reference &middot; D&D</title>
<link rel="icon" href="resources/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="resources/favicon-32.png">
<script src="resources/data-classes.js"></script>
<script src="resources/data-sources.js"></script>
<link rel="stylesheet" href="css/styles.css">
<style>
/* ---- class reference page (shares the spell/species page look) ---- */
.sp-wrap{max-width:none;margin:0;padding:18px 26px 60px}
.sp-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.sp-top h1{font-size:24px;margin:0;color:var(--accent)}
.sp-top .sp-sub{color:var(--muted);font-size:13px}
.sp-top .sp-spacer{flex:1}
.sp-top a.sp-back{color:var(--accent2);font-weight:700;font-size:14px;text-decoration:none}
.sp-top a.sp-back:hover{text-decoration:underline}
.sp-filters{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:12px}
.sp-filter-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.sp-field{display:flex;flex-direction:column;gap:4px}
.sp-field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.sp-field input[type=text],.sp-field select{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line2);border-radius:7px;background:var(--bg);color:var(--ink);min-width:150px}
.sp-field input:focus,.sp-field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
.sp-search{min-width:230px!important;flex:1}
.sp-seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.sp-seg button{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border:0;background:var(--bg);color:var(--ink);cursor:pointer}
.sp-seg button+button{border-left:1px solid var(--line2)}
.sp-seg button.on{background:var(--accent);color:#fff}
.sp-clear{font:inherit;font-size:13px;font-weight:600;color:var(--accent2);background:none;border:0;cursor:pointer;padding:6px 2px}
.sp-clear:hover{text-decoration:underline}
.sp-main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,1.4fr);gap:16px;align-items:start}
.sp-listwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.sp-count{padding:9px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.sp-scroll{max-height:calc(100vh - 250px);overflow:auto}
table.sp-table{width:100%;border-collapse:collapse;font-size:13.5px}
table.sp-table th{position:sticky;top:0;background:var(--head);text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);cursor:pointer;white-space:nowrap;z-index:1}
table.sp-table th:hover{color:var(--accent)}
table.sp-table th .ar{font-size:9px;margin-left:3px}
table.sp-table td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
table.sp-table tbody tr{cursor:pointer}
table.sp-table tbody tr:hover{background:rgba(200,16,46,.06)}
table.sp-table tbody tr.sel{background:rgba(200,16,46,.12)}
.sp-nm{font-weight:700;color:var(--ink)}
.sp-badge{display:inline-block;font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:middle}
.sp-badge.core{background:#7a5b1e;color:#fff}
.sp-badge.cast{background:#3a5ca8;color:#fff}
.sp-badge.hb{background:#b8860b;color:#fff}
.sp-src{color:var(--muted);font-size:12px}
.sp-col-num{text-align:center;width:70px}
.sp-detail{position:sticky;top:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:20px 22px;max-height:calc(100vh - 40px);overflow:auto}
.sp-detail .sp-close{display:none}
.sp-detail h2{margin:0 0 3px;font-size:22px;color:var(--accent)}
.sp-detail .sp-sub2{color:var(--muted);font-style:italic;font-size:14px;margin-bottom:14px}
.sp-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin:0 0 14px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sp-meta .m{font-size:13.5px}
.sp-meta .m.wide{grid-column:1 / -1}
.sp-meta .m b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:1px}
.sp-detail .sp-body p{margin:0 0 10px}
.sp-detail .sp-body ul{margin:0 0 10px;padding-left:20px}
.sp-detail .sp-body table{border-collapse:collapse;margin:6px 0 12px;font-size:13px}
.sp-detail .sp-body th,.sp-detail .sp-body td{border:1px solid var(--line2);padding:4px 8px;text-align:left}
.sp-sec-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--accent2);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.cls-feat{margin:0 0 12px}
.cls-lvl{display:inline-block;min-width:20px;font-size:11px;font-weight:800;color:#fff;background:var(--accent);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:middle}
.cls-fname{font-weight:700}
.prof-cap{text-transform:capitalize}
.cls-sub{border:1px solid var(--line2);border-radius:8px;margin:0 0 8px;overflow:hidden}
.cls-sub>summary{cursor:pointer;padding:9px 12px;font-weight:700;background:var(--bg);list-style:none;user-select:none}
.cls-sub>summary::-webkit-details-marker{display:none}
.cls-sub>summary:before{content:"\25B8";color:var(--accent2);margin-right:8px;font-size:11px}
.cls-sub[open]>summary:before{content:"\25BE"}
.cls-sub .cls-sub-body{padding:8px 12px 4px}
.cls-sub .sp-src{font-weight:400;margin-left:6px}
.sp-empty{color:var(--muted);text-align:center;padding:60px 20px}
.sub-h{font-weight:700}
.tag-dmg{color:var(--accent);font-weight:700}.tag-roll{font-weight:700}.tag-link{color:var(--link)}.tag-note{color:var(--muted);font-style:italic}
@media (max-width:900px){
  .sp-main{grid-template-columns:1fr}
  .sp-detail{position:fixed;inset:0;z-index:50;border-radius:0;max-height:none;display:none}
  .sp-detail.open{display:block}
  .sp-detail .sp-close{display:inline-block;position:absolute;top:12px;right:14px;background:var(--bg);border:1px solid var(--line2);border-radius:7px;width:34px;height:34px;font-size:18px;cursor:pointer;color:var(--ink)}
  .sp-scroll{max-height:none}
}
</style>
</head>
<body>
<div class="sp-wrap">
  <div class="sp-top">
    <h1>Class Reference</h1>
    <span class="sp-sub" id="spTagline"></span>
    <span class="sp-spacer"></span>
    <a class="sp-back" href="races.html">Species</a>
    <a class="sp-back" href="creatures.html">Creatures</a>
    <a class="sp-back" href="spells.html">Spells</a>
    <a class="sp-back" href="feats.html">Feats</a>
    <a class="sp-back" href="items.html">Items</a>
    <a class="sp-back" href="index.html">&larr; Character Creator</a>
  </div>
  <div class="sp-filters">
    <div class="sp-filter-row">
      <div class="sp-field sp-search">
        <label for="fSearch">Search</label>
        <input type="text" id="fSearch" placeholder="Class name&hellip;" autocomplete="off">
      </div>
      <div class="sp-field">
        <label>Version</label>
        <div class="sp-seg" id="fVersion">
          <button data-v="all" class="on">All</button>
          <button data-v="2014">2014</button>
          <button data-v="2024">2024</button>
        </div>
      </div>
      <div class="sp-field">
        <label for="fSource">Book</label>
        <select id="fSource"><option value="">Any book</option></select>
      </div>
      <button class="sp-clear" id="fClear">Reset filters</button>
    </div>
  </div>
  <div class="sp-main">
    <div class="sp-listwrap">
      <div class="sp-count" id="spCount"></div>
      <div class="sp-scroll">
        <table class="sp-table">
          <thead><tr id="spHead"></tr></thead>
          <tbody id="spBody"></tbody>
        </table>
      </div>
    </div>
    <div class="sp-detail" id="spDetail">
      <button class="sp-close" id="spClose">&times;</button>
      <div id="spDetailInner"><div class="sp-empty">Select a class to see its features and subclasses.</div></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var CLASSES=(window.CC_CLASSES||[]).slice();
  var SOURCES=window.CC_SOURCES||{};
  var HB_NAMES={GriffonsSaddlebag2:"The Griffon's Saddlebag, Book 2"};
  function srcName(c){return SOURCES[c]||HB_NAMES[c]||c;}
  var $=function(id){return document.getElementById(id);};
  var REFLOOKUP={};

  // ---------- text helpers (ported from the app's renderer, + feature-ref resolution) ----------
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function ordinal(n){var s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
  function cap(s){return String(s).replace(/\b\w/g,function(c){return c.toUpperCase();});}
  /* A proficiency line is either plain words ("light, medium, shield") or a tagged item list
     ("{@item Dagger|PHB|Daggers}, ..."). Tagged ones must go through the tag renderer - running
     cap() over them would corrupt the tag names. */
  function profText(s){
    s=String(s||"");
    // tagged lists render lowercase in the data ("{@item dagger|phb|daggers}"), so the
    // capitalisation is done in CSS - doing it in JS would corrupt the HTML the tags produce
    return s.indexOf("{@")>=0?'<span class="prof-cap">'+renderTags(s)+"</span>":esc(cap(s));
  }
  function lastSeg(p){for(var i=p.length-1;i>=0;i--)if(p[i]!=="")return p[i];return p[0];}
  function tagHtml(tag,content){
    var p=content.split("|"),txt;
    switch(tag){
      case"b":case"bold":return"<strong>"+p[0]+"</strong>";
      case"i":case"italic":case"nsw":return"<em>"+p[0]+"</em>";
      case"u":return"<u>"+p[0]+"</u>";
      case"s":case"strike":return"<s>"+p[0]+"</s>";
      case"note":return'<span class="tag-note">'+p[0]+"</span>";
      case"h":return"<strong>Hit:</strong> ";
      case"dc":return'<span class="tag-roll">DC '+p[0]+"</span>";
      case"damage":return'<span class="tag-dmg">'+((p[1]&&p[1]!=="")?p[1]:p[0])+"</span>";
      case"scaledamage":return'<span class="tag-dmg">'+lastSeg(p)+"</span>";
      case"dice":case"d20":case"hit":return'<span class="tag-roll">'+((p[1]&&p[1]!=="")?p[1]:p[0])+"</span>";
      case"scaledice":return'<span class="tag-roll">'+lastSeg(p)+"</span>";
      case"chance":return'<span class="tag-roll">'+p[0]+" percent</span>";
      case"recharge":return"(Recharge "+(p[0]||"6")+")";
      case"filter":case"book":case"quickref":case"adventure":case"footnote":case"area":
        return '<span class="tag-link">'+p[0]+"</span>";
      default:
        txt=(p.length>=3&&p[2])?p[2]:p[0];return '<span class="tag-link">'+txt+"</span>";
    }
  }
  function renderTags(s){
    s=esc(s);
    var re=/\{@(\w+)\s*([^{}]*)\}/,m,guard=0;
    while((m=re.exec(s))&&guard++<800){s=s.slice(0,m.index)+tagHtml(m[1],(m[2]||"").trim())+s.slice(m.index+m[0].length);}
    return s;
  }
  function renderInline(e){
    if(e==null)return"";
    if(typeof e==="string")return renderTags(e);
    if(e.type==="list")return renderEntry(e);
    var nm=e.name?'<span class="sub-h">'+renderTags(e.name)+".</span> ":"";
    return nm+([].concat(e.entries||e.entry||[]).map(renderInline).join(" "));
  }
  function renderEntry(e){
    if(e==null)return"";
    if(typeof e==="string")return"<p>"+renderTags(e)+"</p>";
    var t=e.type;
    if(t==="refClassFeature"||t==="refSubclassFeature"){
      var key=e.classFeature||e.subclassFeature||"",tgt=REFLOOKUP[key];
      if(tgt)return renderEntry({type:"entries",name:tgt.name,entries:tgt.entries||[]});
      return "<p><span class=\"sub-h\">"+esc(key.split("|")[0])+".</span></p>";
    }
    if(t==="entries"||t==="section"||t===undefined){
      var lead=e.name?'<span class="sub-h">'+renderTags(e.name)+".</span> ":"";
      var inner=(e.entries||[]).map(renderEntry).join("");
      if(e.name&&inner.indexOf("<p>")===0){inner=inner.replace("<p>","<p>"+lead);lead="";}
      return (lead?"<p>"+lead+"</p>":"")+inner;
    }
    if(t==="list")return "<ul>"+(e.items||[]).map(function(it){return "<li>"+renderInline(it)+"</li>";}).join("")+"</ul>";
    if(t==="item"){var nm=e.name?'<span class="sub-h">'+renderTags(e.name)+"</span> ":"";return "<p>"+nm+([].concat(e.entries||e.entry||[]).map(renderInline).join(" "))+"</p>";}
    if(t==="table"){
      var head=(e.colLabels||[]).map(function(c){return "<th>"+renderTags(c)+"</th>";}).join("");
      var rows=(e.rows||[]).map(function(r){return "<tr>"+r.map(function(c){return "<td>"+renderInline(c)+"</td>";}).join("")+"</tr>";}).join("");
      return "<table>"+(head?"<thead><tr>"+head+"</tr></thead>":"")+"<tbody>"+rows+"</tbody></table>";
    }
    if(t==="quote")return "<p><em>"+(e.entries||[]).map(renderInline).join(" ")+"</em></p>";
    return "<p>"+renderInline(e)+"</p>";
  }

  // ---------- filter option lists ----------
  var sourceSet={};
  CLASSES.forEach(function(c){sourceSet[c.source]=1;});
  function keysSorted(o){var a=[];for(var k in o)a.push(k);a.sort();return a;}
  keysSorted(sourceSet).sort(function(a,b){return srcName(a).localeCompare(srcName(b));}).forEach(function(c){
    var o=document.createElement("option");o.value=c;o.textContent=(srcName(c)!==c)?(srcName(c)+" ("+c+")"):c;$("fSource").appendChild(o);
  });

  var st={q:"",version:"all",source:"",sort:"name",dir:1,sel:null};
  function inVersion(c){
    if(st.version==="2014")return c.edition==="classic";
    if(st.version==="2024")return c.edition==="one";
    return true;
  }
  function pass(c){
    if(st.q&&c.name.toLowerCase().indexOf(st.q)<0)return false;
    if(!inVersion(c))return false;
    if(st.source&&c.source!==st.source)return false;
    return true;
  }
  var COLS=[
    {k:"name", t:"Class", cell:function(c){return '<span class="sp-nm">'+esc(c.name)+"</span>"+(c.isCore?' <span class="sp-badge core" title="Core class">core</span>':"")+' <span class="sp-src">'+esc(c.editionLabel)+"</span>";}},
    {k:"hdFaces", t:"Hit Die", cls:"sp-col-num", cell:function(c){return "d"+c.hdFaces;}, val:function(c){return c.hdFaces;}},
    {k:"nSub", t:"Subclasses", cls:"sp-col-num", cell:function(c){return c.nSub||0;}, val:function(c){return c.nSub||0;}},
    {k:"source", t:"Book", cell:function(c){return '<span class="sp-src" title="'+esc(srcName(c.source))+'">'+esc(c.source)+"</span>";}}
  ];
  function sortVal(c,k){var col=null;for(var i=0;i<COLS.length;i++)if(COLS[i].k===k)col=COLS[i];if(col&&col.val)return col.val(c);return String(c[k]||"").toLowerCase();}

  function renderHead(){
    $("spHead").innerHTML=COLS.map(function(c){
      var ar=st.sort===c.k?'<span class="ar">'+(st.dir>0?"▲":"▼")+"</span>":"";
      return '<th data-k="'+c.k+'"'+(c.cls?' class="'+c.cls+'"':"")+">"+c.t+ar+"</th>";
    }).join("");
    Array.prototype.forEach.call($("spHead").children,function(th){
      th.addEventListener("click",function(){var k=th.getAttribute("data-k");if(st.sort===k)st.dir=-st.dir;else{st.sort=k;st.dir=1;}renderHead();renderList();});
    });
  }
  function renderList(){
    var rows=CLASSES.filter(pass);
    rows.sort(function(a,b){
      var va=sortVal(a,st.sort),vb=sortVal(b,st.sort);
      if(va<vb)return -st.dir;if(va>vb)return st.dir;
      return a.name<b.name?-1:(a.editionLabel<b.editionLabel?-1:1);
    });
    $("spCount").textContent="Showing "+rows.length+" of "+CLASSES.length+" classes";
    var body=$("spBody");
    if(!rows.length){body.innerHTML='<tr><td colspan="'+COLS.length+'"><div class="sp-empty">No classes match these filters.</div></td></tr>';return;}
    body.innerHTML=rows.map(function(c){
      var sel=(st.sel===c.slug)?" sel":"";
      return '<tr class="sprow'+sel+'" data-id="'+esc(c.slug)+'">'+COLS.map(function(col){return "<td"+(col.cls?' class="'+col.cls+'"':"")+">"+col.cell(c)+"</td>";}).join("")+"</tr>";
    }).join("");
    Array.prototype.forEach.call(body.querySelectorAll(".sprow"),function(tr){tr.addEventListener("click",function(){selectClass(tr.getAttribute("data-id"));});});
  }

  // ---------- per-class feature data is loaded on demand ----------
  function loadFeatures(slug,cb){
    window.CC_FEATURE_DATA=window.CC_FEATURE_DATA||{};
    if(window.CC_FEATURE_DATA[slug])return cb(window.CC_FEATURE_DATA[slug]);
    var s=document.createElement("script");s.src="resources/features/"+slug+".js";
    s.onload=function(){cb(window.CC_FEATURE_DATA[slug]);};
    s.onerror=function(){cb(null);};
    document.head.appendChild(s);
  }
  function classBySlug(s){for(var i=0;i<CLASSES.length;i++)if(CLASSES[i].slug===s)return CLASSES[i];return null;}
  function selectClass(slug){
    st.sel=slug;
    Array.prototype.forEach.call($("spBody").querySelectorAll(".sprow"),function(tr){tr.classList.toggle("sel",tr.getAttribute("data-id")===slug);});
    $("spDetailInner").innerHTML='<div class="sp-empty">Loading&hellip;</div>';
    $("spDetail").classList.add("open");
    loadFeatures(slug,function(fd){if(st.sel===slug)renderDetail(classBySlug(slug),fd);});
  }

  function featureBlock(f){
    return '<div class="cls-feat"><span class="cls-lvl">'+(f.level||1)+'</span><span class="cls-fname">'+renderTags(f.name)+"</span>"+
      '<div class="cls-fbody">'+[].concat(f.entries||[]).map(renderEntry).join("")+"</div></div>";
  }
  function byLevel(a,b){return (a.level||0)-(b.level||0);}
  function renderDetail(ci,fd){
    if(!ci){$("spDetailInner").innerHTML='<div class="sp-empty">Select a class to see its features and subclasses.</div>';return;}
    if(!fd){$("spDetailInner").innerHTML='<div class="sp-empty">Feature data for '+esc(ci.name)+' could not be loaded. Open this page from the app folder.</div>';return;}
    REFLOOKUP=fd.refLookup||{};
    var p=fd.proficiencies||{};
    var meta=
      '<div class="m"><b>Hit Die</b>d'+ci.hdFaces+"</div>"+
      (p.savingThrows?'<div class="m"><b>Saving Throws</b>'+esc(p.savingThrows)+"</div>":"")+
      (fd.spellcastingAbility?'<div class="m"><b>Spellcasting</b>'+esc(fd.spellcastingAbility)+"</div>":'<div class="m"><b>Spellcasting</b>—</div>')+
      (p.armor?'<div class="m"><b>Armor</b>'+profText(p.armor)+"</div>":"")+
      (p.weapons?'<div class="m"><b>Weapons</b>'+profText(p.weapons)+"</div>":"")+
      (p.tools&&p.tools!=="None"?'<div class="m"><b>Tools</b>'+profText(p.tools)+"</div>":"")+
      (p.skills?'<div class="m wide"><b>Skills</b>Choose '+p.skills.count+" from "+esc((p.skills.from||[]).join(", "))+"</div>":"");
    var feats=(fd.classFeatures||[]).slice().sort(byLevel).map(featureBlock).join("");
    var subs=(fd.subclasses||[]).map(function(s){
      var fh=(s.features||[]).slice().sort(byLevel).map(featureBlock).join("");
      return '<details class="cls-sub"><summary>'+esc(s.name)+(s.hb?' <span class="sp-badge hb">HB</span>':"")+
        '<span class="sp-src">'+esc(srcName(s.source))+"</span></summary><div class=\"cls-sub-body\">"+fh+"</div></details>";
    }).join("");
    var book=(srcName(ci.source)!==ci.source)?(esc(ci.source)+" — "+esc(srcName(ci.source))):esc(ci.source);
    $("spDetailInner").innerHTML=
      "<h2>"+esc(ci.name)+"</h2>"+
      '<div class="sp-sub2">'+esc(ci.editionLabel)+" &middot; "+book+((fd.subclasses||[]).length?" &middot; "+fd.subclasses.length+" subclasses":"")+"</div>"+
      '<div class="sp-meta">'+meta+"</div>"+
      '<div class="sp-body"><div class="sp-sec-h">Class Features</div>'+feats+
      ((fd.subclasses||[]).length?'<div class="sp-sec-h">Subclasses</div>'+subs:"")+"</div>";
    $("spDetail").scrollTop=0;
  }

  // ---------- wire controls ----------
  var searchT;
  $("fSearch").addEventListener("input",function(){clearTimeout(searchT);var v=this.value;searchT=setTimeout(function(){st.q=v.trim().toLowerCase();renderList();},120);});
  Array.prototype.forEach.call($("fVersion").children,function(b){
    b.addEventListener("click",function(){st.version=b.getAttribute("data-v");Array.prototype.forEach.call($("fVersion").children,function(x){x.classList.toggle("on",x===b);});renderList();});
  });
  $("fSource").addEventListener("change",function(){st.source=this.value;renderList();});
  $("fClear").addEventListener("click",function(){
    st.q="";st.version="all";st.source="";
    $("fSearch").value="";$("fSource").value="";
    Array.prototype.forEach.call($("fVersion").children,function(x){x.classList.toggle("on",x.getAttribute("data-v")==="all");});
    renderList();
  });
  $("spClose").addEventListener("click",function(){$("spDetail").classList.remove("open");});

  // ---------- boot ----------
  if(!CLASSES.length){
    $("spBody").innerHTML='<tr><td colspan="'+COLS.length+'"><div class="sp-empty">Class data not found. Open this page from the app folder so <code>resources/data-classes.js</code> can load.</div></td></tr>';
  }else{
    $("spTagline").textContent=CLASSES.length+" classes across "+keysSorted(sourceSet).length+" books";
    renderHead();renderList();
  }
})();
</script>
</body>
</html>
