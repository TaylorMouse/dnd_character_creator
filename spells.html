<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spell Reference &middot; D&D</title>
<link rel="icon" href="resources/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="resources/favicon-32.png">
<script src="resources/data-spells.js"></script>
<script src="resources/data-sources.js"></script>
<link rel="stylesheet" href="css/styles.css">
<style>
/* ---- spell reference page (self-contained layout on top of the app's theme tokens) ---- */
.sp-wrap{max-width:none;margin:0;padding:18px 26px 60px}
.sp-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.sp-top h1{font-size:24px;margin:0;color:var(--accent)}
.sp-top .sp-sub{color:var(--muted);font-size:13px}
.sp-top .sp-spacer{flex:1}
.sp-top a.sp-back{color:var(--accent2);font-weight:700;font-size:14px;text-decoration:none}
.sp-top a.sp-back:hover{text-decoration:underline}

.sp-filters{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:12px}
.sp-filter-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.sp-field{display:flex;flex-direction:column;gap:4px}
.sp-field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.sp-field input[type=text],.sp-field select{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line2);border-radius:7px;background:var(--bg);color:var(--ink);min-width:150px}
.sp-field input:focus,.sp-field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
.sp-search{min-width:230px!important;flex:1}

.sp-seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.sp-seg button{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border:0;background:var(--bg);color:var(--ink);cursor:pointer}
.sp-seg button+button{border-left:1px solid var(--line2)}
.sp-seg button.on{background:var(--accent);color:#fff}

.sp-levels{display:flex;gap:5px;flex-wrap:wrap}
.sp-lchip{width:30px;height:30px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sp-lchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sp-toggles{display:flex;gap:14px;align-items:center}
.sp-toggles label{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.sp-clear{font:inherit;font-size:13px;font-weight:600;color:var(--accent2);background:none;border:0;cursor:pointer;padding:6px 2px}
.sp-clear:hover{text-decoration:underline}

.sp-main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(360px,0.9fr);gap:16px;align-items:start}
.sp-listwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.sp-count{padding:9px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.sp-scroll{max-height:calc(100vh - 250px);overflow:auto}
table.sp-table{width:100%;border-collapse:collapse;font-size:13.5px}
table.sp-table th{position:sticky;top:0;background:var(--head);text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);cursor:pointer;white-space:nowrap;z-index:1}
table.sp-table th:hover{color:var(--accent)}
table.sp-table th .ar{font-size:9px;margin-left:3px}
table.sp-table td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
table.sp-table tbody tr{cursor:pointer}
table.sp-table tbody tr:hover{background:rgba(200,16,46,.06)}
table.sp-table tbody tr.sel{background:rgba(200,16,46,.12)}
.sp-nm{font-weight:700;color:var(--ink)}
.sp-badge{display:inline-block;font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:middle}
.sp-badge.c{background:#6a4bd0;color:#fff}
.sp-badge.r{background:#2e7d32;color:#fff}
.sp-src{color:var(--muted);font-size:12px}
.sp-col-num{text-align:center;width:44px}

.sp-detail{position:sticky;top:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:20px 22px;max-height:calc(100vh - 40px);overflow:auto}
.sp-detail .sp-close{display:none}
.sp-detail h2{margin:0 0 3px;font-size:22px;color:var(--accent)}
.sp-detail .sp-sub2{color:var(--muted);font-style:italic;font-size:14px;margin-bottom:14px}
.sp-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin:0 0 14px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sp-meta .m{font-size:13.5px}
.sp-meta .m b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:1px}
.sp-detail .sp-body p{margin:0 0 10px}
.sp-detail .sp-body ul{margin:0 0 10px;padding-left:20px}
.sp-detail .sp-body table{border-collapse:collapse;margin:6px 0 12px;font-size:13px}
.sp-detail .sp-body th,.sp-detail .sp-body td{border:1px solid var(--line2);padding:4px 8px;text-align:left}
.sp-hl{margin:12px 0 0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--bg);border-radius:6px}
.sp-hl b{color:var(--accent2)}
.sp-classes{margin-top:14px;font-size:13px}
.sp-classes .ct{display:inline-block;font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;width:52px}
.sp-empty{color:var(--muted);text-align:center;padding:60px 20px}
.sub-h{font-weight:700}
.tag-dmg{color:var(--accent);font-weight:700}
.tag-roll{font-weight:700}
.tag-link{color:var(--link)}
.tag-note{color:var(--muted);font-style:italic}

@media (max-width:900px){
  .sp-main{grid-template-columns:1fr}
  .sp-detail{position:fixed;inset:0;z-index:50;border-radius:0;max-height:none;display:none}
  .sp-detail.open{display:block}
  .sp-detail .sp-close{display:inline-block;position:absolute;top:12px;right:14px;background:var(--bg);border:1px solid var(--line2);border-radius:7px;width:34px;height:34px;font-size:18px;cursor:pointer;color:var(--ink)}
  .sp-scroll{max-height:none}
}
</style>
</head>
<body>
<div class="sp-wrap">
  <div class="sp-top">
    <h1>Spell Reference</h1>
    <span class="sp-sub" id="spTagline"></span>
    <span class="sp-spacer"></span>
    <a class="sp-back" href="classes.html">Classes</a>
    <a class="sp-back" href="creatures.html">Creatures</a>
    <a class="sp-back" href="races.html">Species</a>
    <a class="sp-back" href="feats.html">Feats</a>
    <a class="sp-back" href="items.html">Items</a>
    <a class="sp-back" href="index.html">&larr; Character Creator</a>
  </div>

  <div class="sp-filters">
    <div class="sp-filter-row">
      <div class="sp-field sp-search">
        <label for="fSearch">Search</label>
        <input type="text" id="fSearch" placeholder="Spell name&hellip;" autocomplete="off">
      </div>
      <div class="sp-field">
        <label>Version</label>
        <div class="sp-seg" id="fVersion">
          <button data-v="all" class="on">All</button>
          <button data-v="2014">2014</button>
          <button data-v="2024">2024</button>
        </div>
      </div>
      <div class="sp-field">
        <label for="fClass">Class</label>
        <select id="fClass"><option value="">Any class</option></select>
      </div>
      <div class="sp-field">
        <label for="fSchool">School</label>
        <select id="fSchool"><option value="">Any school</option></select>
      </div>
      <div class="sp-field">
        <label for="fSource">Book</label>
        <select id="fSource"><option value="">Any book</option></select>
      </div>
      <button class="sp-clear" id="fClear">Reset filters</button>
    </div>
    <div class="sp-filter-row" style="margin-top:12px">
      <div class="sp-field">
        <label>Level</label>
        <div class="sp-levels" id="fLevels"></div>
      </div>
      <div class="sp-field">
        <label>Only</label>
        <div class="sp-toggles">
          <label><input type="checkbox" id="fConc"> Concentration</label>
          <label><input type="checkbox" id="fRit"> Ritual</label>
        </div>
      </div>
    </div>
  </div>

  <div class="sp-main">
    <div class="sp-listwrap">
      <div class="sp-count" id="spCount"></div>
      <div class="sp-scroll">
        <table class="sp-table">
          <thead><tr id="spHead"></tr></thead>
          <tbody id="spBody"></tbody>
        </table>
      </div>
    </div>
    <div class="sp-detail" id="spDetail">
      <button class="sp-close" id="spClose">&times;</button>
      <div id="spDetailInner"><div class="sp-empty">Select a spell to see its full description.</div></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var SPELLS=(window.CC_SPELLS||[]).slice();
  var SOURCES=window.CC_SOURCES||{};
  var $=function(id){return document.getElementById(id);};

  // ---------- text helpers (ported from the app's renderer) ----------
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function ordinal(n){var s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
  function lastSeg(p){for(var i=p.length-1;i>=0;i--)if(p[i]!=="")return p[i];return p[0];}
  function tagHtml(tag,content){
    var p=content.split("|"),txt;
    switch(tag){
      case"b":case"bold":return"<strong>"+p[0]+"</strong>";
      case"i":case"italic":case"nsw":return"<em>"+p[0]+"</em>";
      case"u":return"<u>"+p[0]+"</u>";
      case"s":case"strike":return"<s>"+p[0]+"</s>";
      case"note":return'<span class="tag-note">'+p[0]+"</span>";
      case"h":return"<strong>Hit:</strong> ";
      case"dc":return'<span class="tag-roll">DC '+p[0]+"</span>";
      case"damage":return'<span class="tag-dmg">'+((p[1]&&p[1]!=="")?p[1]:p[0])+"</span>";
      case"scaledamage":return'<span class="tag-dmg">'+lastSeg(p)+"</span>";
      case"dice":case"d20":case"hit":return'<span class="tag-roll">'+((p[1]&&p[1]!=="")?p[1]:p[0])+"</span>";
      case"scaledice":return'<span class="tag-roll">'+lastSeg(p)+"</span>";
      case"chance":return'<span class="tag-roll">'+p[0]+" percent</span>";
      case"recharge":return"(Recharge "+(p[0]||"6")+")";
      case"filter":case"book":case"quickref":case"adventure":case"footnote":case"area":
        return '<span class="tag-link">'+p[0]+"</span>";
      default:
        txt=(p.length>=3&&p[2])?p[2]:p[0];return '<span class="tag-link">'+txt+"</span>";
    }
  }
  function renderTags(s){
    s=esc(s);
    var re=/\{@(\w+)\s*([^{}]*)\}/,m,guard=0;
    while((m=re.exec(s))&&guard++<800){
      s=s.slice(0,m.index)+tagHtml(m[1],(m[2]||"").trim())+s.slice(m.index+m[0].length);
    }
    return s;
  }
  function renderInline(e){
    if(e==null)return"";
    if(typeof e==="string")return renderTags(e);
    if(e.type==="list")return renderEntry(e);
    var nm=e.name?'<span class="sub-h">'+esc(e.name)+".</span> ":"";
    return nm+([].concat(e.entries||e.entry||[]).map(renderInline).join(" "));
  }
  function renderEntry(e){
    if(e==null)return"";
    if(typeof e==="string")return"<p>"+renderTags(e)+"</p>";
    var t=e.type;
    if(t==="entries"||t==="section"||t===undefined){
      var lead=e.name?'<span class="sub-h">'+esc(e.name)+".</span> ":"";
      var inner=(e.entries||[]).map(renderEntry).join("");
      if(e.name&&inner.indexOf("<p>")===0){inner=inner.replace("<p>","<p>"+lead);lead="";}
      return (lead?"<p>"+lead+"</p>":"")+inner;
    }
    if(t==="list")return "<ul>"+(e.items||[]).map(function(it){return "<li>"+renderInline(it)+"</li>";}).join("")+"</ul>";
    if(t==="item"){
      var nm=e.name?'<span class="sub-h">'+esc(e.name)+"</span> ":"";
      return "<p>"+nm+([].concat(e.entries||e.entry||[]).map(renderInline).join(" "))+"</p>";
    }
    if(t==="table"){
      var head=(e.colLabels||[]).map(function(c){return "<th>"+renderTags(c)+"</th>";}).join("");
      var rows=(e.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){return "<td>"+renderInline(c)+"</td>";}).join("")+"</tr>";
      }).join("");
      return "<table>"+(head?"<thead><tr>"+head+"</tr></thead>":"")+"<tbody>"+rows+"</tbody></table>";
    }
    if(t==="quote")return "<p><em>"+(e.entries||[]).map(renderInline).join(" ")+"</em></p>";
    return "<p>"+renderInline(e)+"</p>";
  }

  // ---------- derive filter option lists from the data ----------
  var classSet={},schoolSet={},sourceSet={};
  SPELLS.forEach(function(s){
    (s.cls.classic||[]).forEach(function(c){classSet[c]=1;});
    (s.cls.one||[]).forEach(function(c){classSet[c]=1;});
    if(s.school)schoolSet[s.school]=1;
    sourceSet[s.source]=1;
  });
  function keysSorted(o){var a=[];for(var k in o)a.push(k);a.sort();return a;}
  keysSorted(classSet).forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=c;$("fClass").appendChild(o);});
  keysSorted(schoolSet).forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=c;$("fSchool").appendChild(o);});
  // books: sort by full name, label "ABBR — Full title"
  keysSorted(sourceSet).sort(function(a,b){return (SOURCES[a]||a).localeCompare(SOURCES[b]||b);}).forEach(function(c){
    var o=document.createElement("option");o.value=c;o.textContent=SOURCES[c]?(SOURCES[c]+" ("+c+")"):c;$("fSource").appendChild(o);
  });
  // level chips 0..9
  var LVL_LABEL={0:"C"};
  for(var i=0;i<=9;i++){
    var b=document.createElement("button");b.className="sp-lchip";b.setAttribute("data-lvl",i);
    b.textContent=LVL_LABEL[i]||i;b.title=i===0?"Cantrip":ordinal(i)+" level";
    $("fLevels").appendChild(b);
  }

  // ---------- filter / sort state ----------
  var st={q:"",version:"all",cls:"",school:"",source:"",levels:{},conc:false,rit:false,sort:"name",dir:1,sel:null};

  // version = the ruleset the spell's source book belongs to (XPHB/FRHoF/EFA are 2024)
  function inVersion(s){
    if(st.version==="2014")return s.ed==="2014";
    if(st.version==="2024")return s.ed==="2024";
    return true;
  }
  // class availability is recorded per edition; a class match in either list counts
  function hasClass(s){
    if(!st.cls)return true;
    return (s.cls.classic||[]).indexOf(st.cls)>=0||(s.cls.one||[]).indexOf(st.cls)>=0;
  }
  function anyLevel(){for(var k in st.levels)if(st.levels[k])return true;return false;}
  function pass(s){
    if(st.q&&s.name.toLowerCase().indexOf(st.q)<0)return false;
    if(!inVersion(s))return false;
    if(!hasClass(s))return false;
    if(st.school&&s.school!==st.school)return false;
    if(st.source&&s.source!==st.source)return false;
    if(anyLevel()&&!st.levels[s.level])return false;
    if(st.conc&&!s.conc)return false;
    if(st.rit&&!s.ritual)return false;
    return true;
  }

  var COLS=[
    {k:"name",   t:"Name",  cell:function(s){return '<span class="sp-nm">'+esc(s.name)+"</span>"+(s.conc?' <span class="sp-badge c" title="Concentration">C</span>':"")+(s.ritual?' <span class="sp-badge r" title="Ritual">R</span>':"");}},
    {k:"level",  t:"Lvl",   cls:"sp-col-num", cell:function(s){return s.level===0?"C":s.level;}, val:function(s){return s.level;}},
    {k:"school", t:"School", cell:function(s){return esc(s.school||"");}},
    {k:"time",   t:"Time",  cell:function(s){return esc(s.time||"");}},
    {k:"range",  t:"Range", cell:function(s){return esc(s.range||"");}},
    {k:"comp",   t:"Comp.", cell:function(s){return esc(s.comp||"");}},
    {k:"source", t:"Book",  cell:function(s){return '<span class="sp-src" title="'+esc(SOURCES[s.source]||s.source)+'">'+esc(s.source)+"</span>";}}
  ];
  function sortVal(s,k){
    var col=null;for(var i=0;i<COLS.length;i++)if(COLS[i].k===k)col=COLS[i];
    if(col&&col.val)return col.val(s);
    return String(s[k]||"").toLowerCase();
  }

  function renderHead(){
    $("spHead").innerHTML=COLS.map(function(c){
      var ar=st.sort===c.k?'<span class="ar">'+(st.dir>0?"▲":"▼")+"</span>":"";
      return '<th data-k="'+c.k+'"'+(c.cls?' class="'+c.cls+'"':"")+">"+c.t+ar+"</th>";
    }).join("");
    Array.prototype.forEach.call($("spHead").children,function(th){
      th.addEventListener("click",function(){
        var k=th.getAttribute("data-k");
        if(st.sort===k)st.dir=-st.dir;else{st.sort=k;st.dir=1;}
        renderHead();renderList();
      });
    });
  }

  function renderList(){
    var rows=SPELLS.filter(pass);
    rows.sort(function(a,b){
      var va=sortVal(a,st.sort),vb=sortVal(b,st.sort);
      if(va<vb)return -st.dir;if(va>vb)return st.dir;
      // stable secondary: level then name
      if(a.level!==b.level)return a.level-b.level;
      return a.name<b.name?-1:1;
    });
    $("spCount").textContent="Showing "+rows.length+" of "+SPELLS.length+" spells";
    var body=$("spBody");
    if(!rows.length){body.innerHTML='<tr><td colspan="'+COLS.length+'"><div class="sp-empty">No spells match these filters.</div></td></tr>';return;}
    var html=rows.map(function(s,i){
      var id=s.name+"|"+s.source;
      var sel=(st.sel===id)?" sel":"";
      return '<tr class="sprow'+sel+'" data-id="'+esc(id)+'">'+COLS.map(function(c){
        return "<td"+(c.cls?' class="'+c.cls+'"':"")+">"+c.cell(s)+"</td>";
      }).join("")+"</tr>";
    }).join("");
    body.innerHTML=html;
    Array.prototype.forEach.call(body.querySelectorAll(".sprow"),function(tr){
      tr.addEventListener("click",function(){selectSpell(tr.getAttribute("data-id"));});
    });
  }

  function spellById(id){for(var i=0;i<SPELLS.length;i++)if(SPELLS[i].name+"|"+SPELLS[i].source===id)return SPELLS[i];return null;}
  function selectSpell(id){
    st.sel=id;
    Array.prototype.forEach.call($("spBody").querySelectorAll(".sprow"),function(tr){
      tr.classList.toggle("sel",tr.getAttribute("data-id")===id);
    });
    renderDetail(spellById(id));
    $("spDetail").classList.add("open");
  }

  function levelLine(s){
    var sch=s.school||"";
    var base=s.level===0?(sch+" cantrip"):(ordinal(s.level)+"-level "+sch.toLowerCase());
    if(s.ritual)base+=" (ritual)";
    return base.charAt(0).toUpperCase()+base.slice(1);
  }
  function classesLine(list){return list&&list.length?list.join(", "):"—";}
  function renderDetail(s){
    if(!s){$("spDetailInner").innerHTML='<div class="sp-empty">Select a spell to see its full description.</div>';return;}
    var meta=[
      ["Casting Time",s.time||"—"],
      ["Range",s.range||"—"],
      ["Components",s.compFull||s.comp||"—"],
      ["Duration",(s.conc?"Concentration, ":"")+ (s.duration||"—")]
    ].map(function(m){return '<div class="m"><b>'+m[0]+"</b>"+renderTags(m[1])+"</div>";}).join("");
    var body=(s.entries||[]).map(renderEntry).join("");
    var higher=(s.higher&&s.higher.length)?'<div class="sp-hl"><b>At Higher Levels.</b> '+s.higher.map(function(e){return renderInline(e);}).join(" ")+"</div>":"";
    var classes='<div class="sp-classes">'+
      '<div><span class="ct">2014</span>'+esc(classesLine(s.cls.classic))+"</div>"+
      '<div><span class="ct">2024</span>'+esc(classesLine(s.cls.one))+"</div>"+"</div>";
    var book=SOURCES[s.source]?(esc(s.source)+" — "+esc(SOURCES[s.source])):esc(s.source);
    $("spDetailInner").innerHTML=
      '<h2>'+esc(s.name)+"</h2>"+
      '<div class="sp-sub2">'+esc(levelLine(s))+" &middot; "+book+"</div>"+
      '<div class="sp-meta">'+meta+"</div>"+
      '<div class="sp-body">'+body+higher+"</div>"+
      classes;
    $("spDetail").scrollTop=0;
  }

  // ---------- wire filter controls ----------
  var searchT;
  $("fSearch").addEventListener("input",function(){
    clearTimeout(searchT);var v=this.value;
    searchT=setTimeout(function(){st.q=v.trim().toLowerCase();renderList();},120);
  });
  Array.prototype.forEach.call($("fVersion").children,function(b){
    b.addEventListener("click",function(){
      st.version=b.getAttribute("data-v");
      Array.prototype.forEach.call($("fVersion").children,function(x){x.classList.toggle("on",x===b);});
      renderList();
    });
  });
  $("fClass").addEventListener("change",function(){st.cls=this.value;renderList();});
  $("fSchool").addEventListener("change",function(){st.school=this.value;renderList();});
  $("fSource").addEventListener("change",function(){st.source=this.value;renderList();});
  $("fConc").addEventListener("change",function(){st.conc=this.checked;renderList();});
  $("fRit").addEventListener("change",function(){st.rit=this.checked;renderList();});
  Array.prototype.forEach.call($("fLevels").children,function(b){
    b.addEventListener("click",function(){
      var l=+b.getAttribute("data-lvl");st.levels[l]=!st.levels[l];
      b.classList.toggle("on",st.levels[l]);renderList();
    });
  });
  $("fClear").addEventListener("click",function(){
    st.q="";st.version="all";st.cls="";st.school="";st.source="";st.levels={};st.conc=false;st.rit=false;
    $("fSearch").value="";$("fClass").value="";$("fSchool").value="";$("fSource").value="";
    $("fConc").checked=false;$("fRit").checked=false;
    Array.prototype.forEach.call($("fVersion").children,function(x){x.classList.toggle("on",x.getAttribute("data-v")==="all");});
    Array.prototype.forEach.call($("fLevels").children,function(x){x.classList.remove("on");});
    renderList();
  });
  $("spClose").addEventListener("click",function(){$("spDetail").classList.remove("open");});

  // ---------- boot ----------
  if(!SPELLS.length){
    $("spBody").innerHTML='<tr><td colspan="'+COLS.length+'"><div class="sp-empty">Spell data not found. Open this page from the app folder so <code>resources/data-spells.js</code> can load.</div></td></tr>';
  }else{
    $("spTagline").textContent=SPELLS.length+" spells across "+keysSorted(sourceSet).length+" books";
    renderHead();renderList();
  }
})();
</script>
</body>
</html>
